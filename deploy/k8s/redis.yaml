# The swarm's message bus: Redis Streams with consumer groups.
#   news.raw       Ingestion → Quantitative
#   news.enriched  Quantitative → Inference
# Consumer groups give at-least-once delivery and let a stage scale by
# adding replicas to its group. AOF persistence on a PVC means a restart
# resumes from the last acknowledged entry instead of dropping the backlog.
# Signals do NOT go over the bus: Inference → Risk Router is a signed REST
# call, because the inference agent needs the accept/reject answer back.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: paper-trader
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: paper-trader}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: paper-trader
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: paper-trader}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: paper-trader}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --maxmemory
            - 200mb
            - --maxmemory-policy
            - noeviction  # a full bus must refuse writes, never silently drop news
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
